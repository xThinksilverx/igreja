<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Área Administrativa - Paróquia Monte Claro">
    <title>Login - Paróquia Monte Claro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Menu Mobile -->
    <input class="menu-icon" type="checkbox" id="menu-icon" name="menu-icon" aria-label="Menu de navegação"/>
    <label for="menu-icon" aria-label="Abrir menu"></label>
    
    <!-- Navegação -->
    <nav class="nav" aria-label="Menu principal"> 		
        <ul class="pt-5">
            <li><a href="index.html#inicio">Início</a></li>
            <li><a href="index.html#sobre">Sobre</a></li>
            <li><a href="index.html#avisos">Avisos</a></li>
            <li><a href="index.html#cursos">Cursos</a></li>
            <li><a href="index.html#doacoes">Doações</a></li>
            <li><a href="juama.html">Juama</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section id="inicio">
        <h1 class="main-title">Área Administrativa</h1>
    </section>

    <!-- Container de Login/Cadastro -->
    <section class="auth-section visible">
        <div class="auth-container">
            <!-- Formulário de Login -->
            <div class="auth-form" id="login-form">
                <div class="form-header">
                    <i class="fas fa-user-shield"></i>
                    <h2>Login Administrativo</h2>
                    <p>Acesse o painel de gerenciamento</p>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">
                            <i class="fas fa-envelope"></i>
                            E-mail
                        </label>
                        <input 
                            type="email" 
                            id="login-email" 
                            name="email" 
                            placeholder="seu@email.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="login-password">
                            <i class="fas fa-lock"></i>
                            Senha
                        </label>
                        <input 
                            type="password" 
                            id="login-password" 
                            name="password" 
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="fas fa-sign-in-alt"></i>
                        Entrar
                    </button>

                    <div class="form-footer">
                        <a href="#" class="link-secondary">Esqueceu a senha?</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-site">
        <div class="footer-content">
            <span>
                <i class="fas fa-phone-alt"></i>
                <a href="tel:+554734555072">(47) 3455-5072</a>
            </span>
            <span>
                <i class="fab fa-instagram"></i>
                <a href="https://www.instagram.com/paroquiamonteclaro/" target="_blank" rel="noopener noreferrer">@paroquiamonteclaro</a>
            </span>
            <span>
                <i class="fas fa-map-marker-alt"></i>
                R. Hilda Rech, 50 - Vila Nova, Joinville - SC
            </span>
        </div>
        <div class="footer-copy">
            © Todos os direitos reservados à Paróquia Monte Claro
        </div>
    </footer>

    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>
</html>
